## 5. 存储职责边界

| 存储 | 职责 | 数据内容 |
|---|---|---|
| **PostgreSQL** | 结构化事实真相源 | entity, fact, relation, event, entity_alias, fact_history |
| **Qdrant** | 向量语义检索 | chunks, entities, facts, reports, news_embeddings, news_events（6 Collections） |
| **MinIO** | 原始文件归档（规划） | HTML/PDF/图片/原始 JSON |
| **Apache AGE** | 图存储（已集成） | Entity/Relation/Event 图结构、Cypher 查询、事件影响链 |
| ~~pgvector~~ | ~~向量扩展~~ | **已废弃** — 向量存储由 Qdrant 负责 |

> **当前状态**：Apache AGE 已集成（PG17 + AGE 1.5.0 自建镜像）。
> **Fallback**：AGE 不可用时，`get_entity_graph` 等工具自动降级为 PostgreSQL 递归 CTE。
> **同步脚本**：`scripts/sync_to_age.py`（存量数据迁移）。

## 6. 类型枚举

所有 entity_type / relation_type / event_type 的权威定义在 `specs/ontology.yaml`。

- Entity Types：10 种（Company/Person/Product/Technology/Industry/Country/Organization/Event/Metric/Concept）
- Relation Types：10 种（supplier/customer/competitor/depends_on/owns/uses/invests_in/located_in/impacts/causes）
- Event Types：9 种（earnings/regulation/merger/acquisition/product_launch/macro_policy/geopolitical/supply_chain/technology）

## 7. 变更流程

修改 Agent 命名或新增 Agent 时：

1. 更新本文件
2. 同步 `architecture.yaml` 的 scope（如新 Agent 不在 `langgraph/agent/` 范围内）
3. 更新 `docs/design/invenst_platform.md` 的 ARCH 编号索引
4. 为新 Agent 创建 `prompts/{agent_name}/system.md`（遵守 PRM-004）

修改类型枚举时：

1. 更新 `specs/ontology.yaml`
2. 同步 `prompts/knowledge/*.md` 中的类型列表
3. 同步 `mcp-knowledge/server/tools/write.py` 的 docstring
