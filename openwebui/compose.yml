services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2-cuda
    container_name: open-webui
    restart: unless-stopped
    ports:
      # 宿主机 3000 访问 open-webui（3001 留给前端 Vite 开发服务器）；
      # 容器内部改用 8084 监听，避免与 LLM 宿主机端口 8080 冲突导致容器内 localhost:8080 self-loop
      - "3000:8084"
    environment:
      # 服务间统一通过宿主机 localhost:端口 通信（见 extra_hosts 映射）
      PORT: "8084"
      # 关闭登录认证（无登录页，直接可用）
      WEBUI_AUTH: ""
      OPENAI_API_BASE_URL: http://localhost:8080/v1
      OPENAI_API_KEY: dummy
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    networks:
      - ai-platform
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      # 用 127.0.0.1 检查容器自身（8084），避免被 localhost:host-gateway 映射到宿主机
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  open-webui:

networks:
  ai-platform:
    external: true
