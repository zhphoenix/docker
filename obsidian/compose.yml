services:

  obsidian:

    image: lscr.io/linuxserver/obsidian:v1.12.7-ls140

    container_name: obsidian

    restart: unless-stopped


    ports:

      # Web UI
      - "3002:3000"

      # Local REST API
      - "27124:27124"


    # Electron shared memory
    shm_size: "2gb"


    # 限制资源
    mem_limit: 4g
    cpus: "2.0"


    environment:

      PUID: "1000"
      PGID: "1000"

      TZ: Asia/Shanghai


      # --------------------------
      # Disable unnecessary feature
      # --------------------------

      ENABLE_AUDIO: "false"



      # Disable GPU acceleration
      DOCKER_MODS: ""


    volumes:

      # WSL ext4
      - /home/putinking/ai-platform/data/obsidian_vault:/vaults/obsidian_vault


      # config
      - obsidian-config:/config



    logging:

      driver: json-file

      options:

        max-size: "20m"
        max-file: "3"



volumes:

  obsidian-config:



networks:

  default:

    name: ai-platform

    external: true
