services:
  sisyphus:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: sisyphus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/g/models:/models:ro
    networks:
      - ai-platform
    command:
      - -m
      - /models/unsloth/Qwythos-9B-Claude-Mythos-5-1M-MTP-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q4_0
      - -ngl
      - "99"
      - -c
      - "65536"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "6"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          cpus: "2.0"
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
