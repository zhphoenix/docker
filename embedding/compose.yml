services:
  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: embedding
    restart: unless-stopped
    ports:
      - "8001:8080"
    volumes:
      - /mnt/g/models:/models:ro
    networks:
      - ai-platform
    command:
      - -m
      - /models/unsloth/Qwen3-Embedding-4B-f16.gguf
      - --embedding
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -np
      - "16"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          cpus: "1.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
