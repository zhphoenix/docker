services:
  docling:
    image: docling-serve-cu133:latest
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      UVICORN_WORKERS: "4"
      DOCLING_SERVE_MAX_SYNC_WAIT: "1800"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "4"
      DOCLING_SERVE_ARTIFACTS_PATH: ""
    volumes:
      - docling-models:/opt/app-root/src/.cache/docling/models
    networks:
      - ai-platform
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  docling-models:

networks:
  ai-platform:
    external: true
