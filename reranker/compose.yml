services:
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: reranker
    restart: unless-stopped
    ports:
      - "8002:8080"
    volumes:
      - /mnt/g/models:/models:ro
    networks:
      - ai-platform
    command:
      - -m
      - /models/unsloth/Qwen3-Reranker-0.6B-Q8_0.gguf
      - --reranking
      - --embedding
      - --pooling
      - rank
      - --ctx-size
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
