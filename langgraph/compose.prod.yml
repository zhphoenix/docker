# 生产环境 - 镜像固化模式（代码 COPY 进镜像，无热更新）
# 使用: docker compose -f compose.prod.yml up -d --build
services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph
    ports:
      - "8100:8100"
    env_file:
      - ../.env
    environment:
      # 生产模式：禁用热重载
      RELOAD: "false"
      # 显式设置 PostgreSQL 连接（覆盖 .env 中可能的冲突变量）
      # 服务间统一通过宿主机 localhost:端口 通信（见 extra_hosts 映射）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: localhost:9000
      OPENAI_BASE_URL: http://localhost:8080/v1
      EMBEDDING_URL: http://localhost:8001/v1
      RERANKER_URL: http://localhost:8002/v1
      DOCLING_URL: http://localhost:5001
      CRAWL4AI_URL: http://localhost:11235
      LLM_BASE_URL: http://localhost:8080/v1/chat/completions
      OBSIDIAN_URL: https://localhost:27124
      PG_HOST: localhost
      VAULT_ROOT: /vault
      REPORT_SOURCE_DIR: /data/analysis_reports
    volumes:
      # 生产模式：不挂载代码，仅挂载数据卷
      - /mnt/e/ai-platform/data/obsidian_vault:/vault
      - /mnt/e/ai-platform/data/reports:/data/analysis_reports:ro
    networks:
      - ai-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      # 用 127.0.0.1 检查容器自身，避免被 localhost:host-gateway 映射到宿主机
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
