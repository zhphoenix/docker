services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph
    ports:
      - "8100:8100"
    env_file:
      - ../.env
    networks:
      - ai-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
