services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph
    ports:
      - "8100:8100"
    env_file:
      - ../.env
    environment:
      # 显式设置 PostgreSQL 连接（覆盖 .env 中可能的冲突变量）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: minio:9000
      OPENAI_BASE_URL: http://sisyphus:8080/v1
    networks:
      - ai-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
