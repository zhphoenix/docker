services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph
    ports:
      - "8100:8100"
    env_file:
      - ../.env
    environment:
      # 显式设置 PostgreSQL 连接（覆盖 .env 中可能的冲突变量）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: minio:9000
      OPENAI_BASE_URL: http://sisyphus:8080/v1
      VAULT_ROOT: /vault
      REPORT_SOURCE_DIR: /data/analysis_reports
    volumes:
      - /mnt/e/ai-platform/data/obsidian_vault:/vault
      - /mnt/e/ai-platform/data/reports:/data/analysis_reports:ro
    networks:
      - ai-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
