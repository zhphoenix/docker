services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: langgraph
    ports:
      - "8100:8100"
    env_file:
      - ../.env
    environment:
      # 开发模式：启用 uvicorn 热重载
      RELOAD: "true"
      # 显式设置 PostgreSQL 连接（覆盖 .env 中可能的冲突变量）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: localhost:9000
      OPENAI_BASE_URL: http://localhost:8080/v1
      EMBEDDING_URL: http://localhost:8001/v1
      RERANKER_URL: http://localhost:8002/v1
      DOCLING_URL: http://localhost:5001
      CRAWL4AI_URL: http://localhost:11235
      LLM_BASE_URL: http://localhost:8080/v1/chat/completions
      PG_HOST: localhost
      REPORT_SOURCE_DIR: /data/analysis_reports
    volumes:
      - .:/app
      - ../registry:/registry:ro
      - ../minio/data:/data/minio:ro
      - ../data/reports:/data/analysis_reports:ro
      - ../data/stock_a:/data/stock_a:ro
      - ../data/stock_h:/data/stock_h:ro
      - ../data/stock_us:/data/stock_us:ro
    networks:
      - ai-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai-platform:
    external: true
