# Policy Center - 运行时策略配置
# 支持热更新：修改后无需重启服务

# 数据源优先级
data_source:
  priority:
    - chunk_extract    # 优先从已解析的 chunks 提取
    - akshare          # 回退到 AkShare API
    - manual           # 最后使用手动录入
  fallback_enabled: true
  max_fallback_depth: 2

# Rate Limit
rate_limit:
  llm:
    requests_per_minute: 30
    tokens_per_minute: 100000
  embedding:
    requests_per_minute: 60
    batch_size: 32
  qdrant:
    requests_per_minute: 120
  akshare:
    requests_per_minute: 10
    retry_delay_seconds: 5

# 重试策略
retry:
  max_retries: 3
  backoff_multiplier: 2
  initial_delay_seconds: 1
  max_delay_seconds: 30
  retryable_errors:
    - "timeout"
    - "connection_error"
    - "rate_limit_exceeded"

# Agent 路由策略
routing:
  default_agent: "chat"
  confidence_threshold: 0.7
  fallback_agent: "chat"
  rules:
    - pattern: "分析|研究|年报|深度"
      agent: "research"
      priority: 10
    - pattern: "估值|投资|买入|DCF|护城河|大师"
      agent: "investment"
      priority: 20
    - pattern: "笔记|记录|写入"
      agent: "kb"
      priority: 15

# 文档处理 Pipeline
pipeline:
  batch_size: 50
  max_concurrent: 3
  chunk_size: 1000
  chunk_overlap: 200
  embed_batch_size: 16
  docling_timeout: 600
  docling_poll_interval: 5
  # DP-C2 双通道开关：package=内嵌图调抽取并写 Package 草稿；direct=独立任务直写 core.* 作为回退
  extraction:
    mode: direct
  # DP-D1 Publish 策略：草稿校验通过 → published，通知 KOC Inbox（DB 置位拉模式）
  publish:
    auto_publish: false          # 草稿保存后是否自动发布（验收/生产可按需开启）
    max_failed_retries: 3        # 发布校验失败重试上限，达上限置 failed（人工 Re-Publish）
    destination: "koc_inbox"     # 发布目标：KOC Inbox 经 status='published' 拉取消费

# Scheduler 定时任务
scheduler:
  daily_pipeline_limit: 100
  enabled: true

# SiYuan 渲染触发策略（KOC-F4）
# 总开关可整体停用渲染（关闭后审核通过不再产生 render_jobs，展示层故障不影响 PG SoT）；
# 策略区分新增/已有实体的渲染方式：新增实体全量 sync_entity，已有实体增量 sync_section。
rendering:
  enabled: true
  strategy:
    new_entity: full              # 新增实体 → 全量渲染（sync_entity，section 为空）
    existing_entity: incremental  # 已有实体 → 增量渲染（sync_section，section=变更块）
    existing_section: "facts"     # 已有实体增量渲染默认 section（本次合并带来的变更块）

# 知识治理检测（KOC-B1）
# 原则：先只写 core.knowledge_conflicts 不自动动作，由 Governance 面板人工处理
# （KOC 计划书风险 #3：阈值先保守，误报入面板不自动执行）
governance:
  enabled: true
  duplicate_threshold: 0.85        # 实体名 trgm 相似度阈值（≥ 视为重复候选）
  low_confidence_threshold: 0.6    # 关系/事实置信度阈值（< 视为低置信）

# Task Worker
worker:
  poll_interval_seconds: 30
  max_concurrent_tasks: 1
  # 启动时回收僵尸 running 任务：仅回收 started_at 距今超过该秒数的 running 任务
  stale_after_seconds: 300

# Knowledge Ingestion Agent
knowledge:
  extraction:
    max_concurrent_llm: 4
    chunk_max_chars: 3000
    max_chunks_per_document: 200
    entity_similarity_threshold: 0.85
  validation:
    confidence_threshold: 0.6        # 低于此置信度 → 不合规，进 READY_REVIEW（KOC-A2）
    min_evidence_count: 1            # Fact 至少需要 1 条 Evidence（KOC-A2）
  storage:
    entity_batch_size: 50
    relation_batch_size: 100
    fact_batch_size: 100
    qdrant_upsert_batch: 200
  retrieval:
    graph_max_depth: 2
    vector_limit: 10
    hybrid_merge_strategy: "rrf"

# 人审配置
approval:
  content_threshold: 2000   # 超过此字符数的内容需审批
  enabled: true
  triggers:
    - "report_publish"
  timeout_hours: 24
  auto_approve_after_timeout: false

# News Intelligence Agent
news:
  classification:
    max_concurrent_llm: 3
  extraction:
    max_concurrent_llm: 4
    article_max_chars: 3000
  impact:
    max_concurrent_llm: 2
  publisher:
    enable_knowledge_merge: true
